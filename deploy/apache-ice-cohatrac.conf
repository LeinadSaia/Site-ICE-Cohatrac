# ==============================================================================
# VirtualHost Apache 2.4 — Igreja Cristã Evangélica em Cohatrac (ICE Cohatrac)
# Configuração de Reverse Proxy para aplicação Next.js rodando na porta 3000
# ==============================================================================

<VirtualHost *:80>
    # Substitua pelo domínio real da igreja quando configurado no DNS
    ServerName icecohatrac.com.br
    ServerAlias www.icecohatrac.com.br
    ServerAdmin contato@icecohatrac.com.br

    # Redirecionamento automático para HTTPS (após instalar certificado SSL com Certbot)
    # RewriteEngine On
    # RewriteCond %{SERVER_NAME} =icecohatrac.com.br [OR]
    # RewriteCond %{SERVER_NAME} =www.icecohatrac.com.br
    # RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    # Preservar o cabeçalho original do host enviado pelo cliente
    ProxyPreserveHost On
    ProxyRequests Off

    # Suporte a WebSockets (Next.js HMR / conexões em tempo real)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3000/$1" [P,L]

    # Encaminhamento de requisições para a porta interna do Next.js
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # Cabeçalhos de Proxy e Segurança
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Compressão Gzip (mod_deflate) para acelerar carregamento
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

    # Logs de Acesso e Erros
    ErrorLog ${APACHE_LOG_DIR}/ice-cohatrac_error.log
    CustomLog ${APACHE_LOG_DIR}/ice-cohatrac_access.log combined
</VirtualHost>

